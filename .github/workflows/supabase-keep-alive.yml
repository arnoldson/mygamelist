name: Supabase Keep-Alive

on:
  schedule:
    # Runs every 3 days at 09:00 UTC — well under Supabase's free-tier
    # inactivity window, cheap on Actions minutes.
    - cron: "0 9 */3 * *"
  workflow_dispatch: {} # allows manual trigger from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Ping Supabase via direct Postgres connection
        env:
          DATABASE_URL: ${{ secrets.KEEPALIVE_DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -c "SELECT 1;" -v ON_ERROR_STOP=1
